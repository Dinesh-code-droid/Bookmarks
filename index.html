<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bookmark Diary</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif; padding: 10px;
      background: linear-gradient(135deg, #FFFFFF, #F7FFFD, #FFFFFF);
      background-size: 600% 600%; animation: gradientBG 10s ease infinite;
      color: #222; min-height: 100vh;
    }
    @keyframes gradientBG {
      0%{ background-position:0% 50%; } 50%{ background-position:100% 50%; } 100%{ background-position:0% 50%; }
    }
    h2 { text-align:center; margin-bottom:20px; color:#00002F; text-shadow:1px 1px 3px rgba(0,0,0,0.4); }
    .input-group { margin-bottom:12px; }
    input[type="text"], select {
      width:100%; padding:14px; border:none; border-radius:12px;
      margin-bottom:14px; font-size:16px; background:#fff;
      box-shadow:0 4px 8px rgba(0,0,0,0.1);
    }
    .button-group { display:flex; overflow-x:auto; gap:10px; padding-bottom:14px; margin-bottom:20px; }
    .button-group button {
      flex:0 0 auto; padding:12px 18px; font-size:16px; border:none;
      border-radius:50px; color:#fff; transition:transform 0.2s;
      box-shadow:0 3px 6px rgba(0,0,0,0.2); cursor:pointer;
    }
    .button-group button:hover { transform:scale(1.05); }
    .button-group button:nth-child(1){ background:#ff3c38; }
    .button-group button:nth-child(2){ background:#ffa534; }
    .button-group button:nth-child(3){ background:#17c3b2; }
    .button-group button:nth-child(4){ background:#3d5af1; }
    .button-group button:nth-child(5){ background:#8338ec; }

    /* Tabs */
    #tabBar { display:flex; overflow-x:auto; gap:8px; padding-bottom:10px; margin-bottom:14px; align-items:center; }
    .tab-pill {
      flex:0 0 auto; display:flex; align-items:center; gap:6px;
      padding:9px 16px; border-radius:50px; font-size:14px; font-weight:600;
      background:#fff; color:#333; box-shadow:0 3px 6px rgba(0,0,0,0.12);
      cursor:pointer; border:2px solid transparent; white-space:nowrap;
    }
    .tab-pill.active { background:#00002F; color:#fff; border-color:#17c3b2; }
    .tab-pill .tab-edit-btn {
      background:rgba(255,255,255,0.25); border:none; border-radius:50%;
      width:18px; height:18px; font-size:11px; line-height:18px; text-align:center;
      color:inherit; cursor:pointer; padding:0; display:none;
    }
    .tab-pill.active .tab-edit-btn { background:rgba(255,255,255,0.2); }
    body.editMode .tab-edit-btn { display:inline-block; }
    #addTabBtn {
      flex:0 0 auto; padding:9px 16px; border-radius:50px; font-size:18px; font-weight:600;
      background:#17c3b2; color:#fff; border:none; cursor:pointer; box-shadow:0 3px 6px rgba(0,0,0,0.2);
    }

    /* Single column bookmark list */
    #bookdiv { display:flex; flex-direction:column; min-height:120px; border:1px solid #ddd; border-radius:2px; background:rgba(255,255,255,0.8); }
    #emptyMsg { text-align:center; color:#aaa; padding:24px; width:100%; }

    .bookmark {
      display:block; text-align:left; background:#ffffffee;
      margin:4px auto; width:95%; min-height:60px;
      border-left:4px solid #17c3b2; border-radius:10px;
      box-shadow:0 3px 6px rgba(0,0,0,0.15);
      transition:transform 0.15s, opacity 0.15s;
      position:relative; cursor:pointer;
      user-select:none; -webkit-user-select:none;
      text-decoration:none;
    }
    .bookmark:hover { transform:scale(1.001); }

    /* Dimmed state for non-matching bookmarks while searching */
    .bookmark.dim {
      opacity:0.32;
      filter:grayscale(55%);
      border-left-color:#ccc;
    }
    .bookmark.dim:hover { opacity:0.55; }

    .bookmark strong {
      font-size:14px; display:block; padding:10px 76px 2px 10px;
      color:#111; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .bookmark small { display:block; padding:0 10px 8px 10px; color:#888; font-size:11px; }
    .click-count { color:#17c3b2; font-size:11px; font-weight:600; }
    .tab-tag {
      display:inline-block; margin-right:6px; padding:1px 7px;
      background:#eef7f6; color:#17c3b2; border-radius:20px;
      font-size:10px; font-weight:600; vertical-align:middle;
    }

    /* Inline Edit Controls */
    .edit-fields { padding:8px 76px 8px 10px; display:flex; flex-direction:column; gap:6px; }
    .edit-fields input {
      width:100%; padding:6px 10px; font-size:13px; border:1px solid #ccc;
      border-radius:6px; background:#fff; box-shadow:none; margin-bottom:0;
    }

    .bookmark .star-btn {
      position:absolute; top:8px; right:10px;
      background:none; border:none; padding:2px; cursor:pointer; z-index:11;
      font-size:19px; line-height:1; color:#ccc; opacity:0.55;
      transition:color 0.15s, opacity 0.15s, transform 0.15s;
    }
    .bookmark .star-btn:hover { transform:scale(1.15); opacity:0.85; }
    .bookmark .star-btn.active { color:#111; opacity:1; }

    .bookmark .delete-btn {
      position:absolute; top:50%; transform:translateY(-50%); right:8px;
      background:#f51720; border:none; padding:5px 9px; border-radius:8px;
      color:#fff; font-size:12px; display:none; cursor:pointer; z-index:10;
    }
    .bookmark .delete-btn:hover { background:#d1131a; }

    @media (max-width:500px) {
      .button-group button { padding:10px 14px; font-size:14px; }
      #searchBox { width:60%; }
    }
    #searchBox { padding:10px 20px; width:280px; border-radius:50px; border:1px solid #ccc; font-size:18px; }
    #buttons {
      padding:10px 20px; font-size:18px; background:#FF3D00; color:white;
      border:none; border-radius:50px; margin-left:10px; width:110px; cursor:pointer;
    }
    #buttons:hover { background:#45a049; }
    #dragHint { text-align:center; font-size:12px; color:#aaa; margin-bottom:4px; }

    /* Floating action button */
    #fabBtn {
      position:fixed; right:20px; bottom:20px; width:58px; height:58px;
      border-radius:50%; background:#00002F; color:#fff; font-size:30px;
      border:none; box-shadow:0 6px 16px rgba(0,0,0,0.35); cursor:pointer;
      display:flex; align-items:center; justify-content:center; z-index:100;
      transition:transform 0.2s;
    }
    #fabBtn:hover { transform:scale(1.08); }

    /* Modal */
    #modalOverlay {
      display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45);
      z-index:200; align-items:flex-end; justify-content:center;
    }
    #modalOverlay.open { display:flex; }
    #modalSheet {
      background:#fff; width:100%; max-width:480px; border-radius:20px 20px 0 0;
      padding:20px; box-shadow:0 -6px 20px rgba(0,0,0,0.3);
      max-height:85vh; overflow-y:auto; animation:slideUp 0.25s ease;
    }
    @keyframes slideUp { from{ transform:translateY(30px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
    #modalHeader { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
    #modalHeader h3 { color:#00002F; }
    #modalCloseBtn {
      background:#eee; border:none; width:32px; height:32px; border-radius:50%;
      font-size:16px; cursor:pointer; color:#333;
    }
  </style>
</head>
<body>

<h2>Bookmark Diary</h2>
<input type="text" id="searchBox" autofocus placeholder="search bookmarks or google...."
  onkeydown="if(event.key==='Enter') searchGoogle()">
<button id="buttons" onclick="searchGoogle()">Search</button>
<br><hr><hr><br>

<div id="tabBar"></div>

<p id="dragHint"><span id="hintText">Tap to open links</span></p>
<div id="bookdiv">
  <div class="bookmark-column" id="bookmarkList1"></div>
</div>

<button id="fabBtn" onclick="openModal()" title="Add / manage bookmarks">+</button>

<div id="modalOverlay" onclick="if(event.target===this) closeModal()">
  <div id="modalSheet">
    <div id="modalHeader">
      <h3>Manage Bookmarks</h3>
      <button id="modalCloseBtn" onclick="closeModal()">✕</button>
    </div>

    <div class="input-group">
      <input type="text" id="webURL"    placeholder="Web URL (https://...)">
      <input type="text" id="shortName" placeholder="Short Name (Optional)">
      <select id="categorySelect"></select>
    </div>
    <div class="button-group">
      <button onclick="addnsave()">Add</button>
      <button onclick="toggleDeleteButtons()">Edit Mode</button>
      <button onclick="document.getElementById('importFile').click()">Import</button>
      <button onclick="exportBookmarks()">Export</button>
      <button onclick="window.print()">Print</button>
    </div>
    <input type="file" id="importFile" accept=".txt" onchange="importBookmarks()" style="display:none;">
  </div>
</div>

<script>
  var bookmarks  = [];
  var tabs       = [];
  var activeTab  = 'home';
  var isEditMode = false;
  var searchQuery = '';
  var STORAGE_KEY = 'bookmarkDiaryData';

  function defaultTabs() {
    return [
      { id:'home',  name:'Home' },
      { id:'basic', name:'Basic' },
      { id:'news',  name:'News' }
    ];
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function slugify(s) {
    var base = String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
    if (!base) base = 'tab';
    var id = base, n = 1;
    while (tabs.some(function(t){ return t.id===id; })) { id = base+'-'+(++n); }
    return id;
  }

  function getDaysAgo(dateStr) {
    if (!dateStr || dateStr==='Never') return 'Never opened';
    var d = new Date(dateStr);
    if (isNaN(d.getTime())) return 'Never opened';
    var today=new Date(); today.setHours(0,0,0,0);
    var bDay=new Date(d); bDay.setHours(0,0,0,0);
    var diff=Math.floor((today-bDay)/86400000);
    if (diff<=0) return 'Opened today';
    if (diff===1) return '1 day ago';
    return diff+' days ago';
  }

  // Extract a fallback title from web or local file URLs
  function extractTitleFromUrl(url) {
    try {
      if (/^file:\/\/\//i.test(url)) {
        var parts = url.split('/');
        var fileName = parts[parts.length - 1] || 'Local Page';
        return fileName.replace(/\.[^/.]+$/, ""); // strip extension
      }
      var clean = url.replace(/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//, '');
      var host = clean.split('/')[0].split('?')[0];
      host = host.replace(/^www\./i, '');
      var name = host.split('.')[0];
      return name ? name.charAt(0).toUpperCase() + name.slice(1) : 'Untitled';
    } catch(e) {
      return 'Untitled';
    }
  }

  function getTabName(catId) {
    var t = tabs.find(function(x){ return x.id===catId; });
    return t ? t.name : '';
  }

  // Does a bookmark match the current search query? Checks title, URL, and tab/category name.
  function matchesSearch(bm, q) {
    if (!q) return true;
    if (bm.name && bm.name.toLowerCase().indexOf(q) !== -1) return true;
    if (bm.url && bm.url.toLowerCase().indexOf(q) !== -1) return true;
    var tabName = getTabName(bm.category);
    if (tabName && tabName.toLowerCase().indexOf(q) !== -1) return true;
    return false;
  }

  function recordOpen(id) {
    var bm = bookmarks.find(function(b){ return b.id===id; });
    if (!bm) return;
    bm.lastOpened = new Date().toISOString();
    bm.clickCount = (bm.clickCount||0) + 1;
    saveData();
    displayBookmarks();
  }

  function openModal() {
    document.getElementById('modalOverlay').classList.add('open');
  }
  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
  }

  function searchGoogle() {
    var q=document.getElementById('searchBox').value.trim();
    if (q) window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank');
    else   alert('Please enter a search term.');
  }

  // ── Tabs ──
  function renderTabs() {
    var bar = document.getElementById('tabBar');
    bar.innerHTML = '';
    tabs.forEach(function(t){
      var pill = document.createElement('div');
      pill.className = 'tab-pill' + (t.id===activeTab ? ' active' : '');
      pill.innerHTML = '<span>'+escHtml(t.name)+'</span>'+
        '<button class="tab-edit-btn" data-action="rename" title="Rename">✎</button>'+
        '<button class="tab-edit-btn" data-action="delete" title="Delete">✕</button>';
      pill.addEventListener('click', function(e){
        if (e.target.dataset.action === 'rename') { renameTab(t.id); return; }
        if (e.target.dataset.action === 'delete') { deleteTab(t.id); return; }
        switchTab(t.id);
      });
      bar.appendChild(pill);
    });
    var addBtn = document.createElement('button');
    addBtn.id = 'addTabBtn';
    addBtn.textContent = '+';
    addBtn.title = 'Add tab';
    addBtn.onclick = addTab;
    bar.appendChild(addBtn);

    var sel = document.getElementById('categorySelect');
    var prevVal = sel.value || activeTab;
    sel.innerHTML = tabs.map(function(t){ return '<option value="'+t.id+'">'+escHtml(t.name)+'</option>'; }).join('');
    sel.value = tabs.some(function(t){return t.id===prevVal;}) ? prevVal : activeTab;
  }

  function switchTab(id) {
    activeTab = id;
    document.getElementById('categorySelect').value = id;
    saveData();
    renderTabs();
    displayBookmarks();
  }

  function addTab() {
    var name = prompt('New tab name:');
    if (!name || !name.trim()) return;
    var id = slugify(name.trim());
    tabs.push({ id:id, name:name.trim() });
    saveData();
    switchTab(id);
  }

  function renameTab(id) {
    var t = tabs.find(function(x){ return x.id===id; });
    if (!t) return;
    var name = prompt('Rename tab:', t.name);
    if (!name || !name.trim()) return;
    t.name = name.trim();
    saveData();
    renderTabs();
    displayBookmarks();
  }

  function deleteTab(id) {
    if (tabs.length <= 1) { alert("You need at least one tab."); return; }
    var t = tabs.find(function(x){ return x.id===id; });
    if (!t) return;
    var count = bookmarks.filter(function(b){ return b.category===id; }).length;
    var msg = count>0
      ? 'Delete "'+t.name+'"? '+count+' bookmark(s) will move to the first remaining tab.'
      : 'Delete "'+t.name+'"?';
    if (!confirm(msg)) return;
    tabs = tabs.filter(function(x){ return x.id!==id; });
    var fallback = tabs[0].id;
    bookmarks.forEach(function(b){ if (b.category===id) b.category=fallback; });
    if (activeTab === id) activeTab = fallback;
    saveData();
    renderTabs();
    displayBookmarks();
  }

  // ── Bookmark CRUD ──
  function addBookmark() {
    var name = document.getElementById('shortName').value.trim();
    var url  = document.getElementById('webURL').value.trim();
    var cat  = document.getElementById('categorySelect').value || activeTab;
    if (!url){ alert('Please fill in the URL.'); return false; }
    
    if (!/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(url)) url = 'https://' + url;
    if (!name) name = extractTitleFromUrl(url);

    var newBm = {
      id: 'bm-'+Date.now()+'-'+Math.floor(Math.random()*1000),
      name: name, url: url, category: cat,
      dateTime: new Date().toISOString(), lastOpened: 'Never', clickCount: 0,
      favorite: false
    };
    bookmarks.push(newBm);

    document.getElementById('shortName').value = '';
    document.getElementById('webURL').value = '';
    displayBookmarks();
    return true;
  }

  function addnsave(){ if(addBookmark()){ saveData(); closeModal(); } }

  function displayBookmarks() {
    var list1 = document.getElementById('bookmarkList1');
    list1.innerHTML = '';

    var q = searchQuery;
    var shown, searching = !!q;

    if (searching) {
      // Search mode: consider bookmarks across ALL tabs (title, URL, and tab name all count
      // as match fields, so results can come from tabs other than the active one).
      shown = bookmarks.slice();
      shown.sort(function(a, b){
        var am = matchesSearch(a, q) ? 0 : 1;
        var bm = matchesSearch(b, q) ? 0 : 1;
        return am - bm; // stable sort: matches float to top, relative order otherwise preserved
      });
    } else {
      // Normal mode: exact array order within the active tab only, no sorting
      shown = bookmarks.filter(function(b){ return b.category === activeTab; });
    }

    if (shown.length === 0) {
      var p = document.createElement('p');
      p.id = 'emptyMsg';
      p.textContent = searching ? 'No bookmarks match "'+searchQuery+'".' : 'No bookmarks in this tab yet.';
      list1.appendChild(p);
      return;
    }

    shown.forEach(function(bm){
      var div = document.createElement('a');
      div.className = 'bookmark';
      if (searching && !matchesSearch(bm, q)) div.className += ' dim';
      div.dataset.id = bm.id;
      div.href = bm.url;
      div.target = '_blank';
      div.rel = 'noopener noreferrer';
      var count = bm.clickCount||0;
      var isFav = !!bm.favorite;
      var tabTag = searching ? '<span class="tab-tag">'+escHtml(getTabName(bm.category))+'</span>' : '';

      if (isEditMode) {
        div.innerHTML =
          '<div class="edit-fields">' +
            '<input type="text" class="edit-name" value="' + escHtml(bm.name) + '" placeholder="Title">' +
            '<input type="text" class="edit-url" value="' + escHtml(bm.url) + '" placeholder="URL">' +
          '</div>' +
          '<button class="delete-btn" style="display:block;" data-id="'+bm.id+'">Delete</button>';

        var inputName = div.querySelector('.edit-name');
        var inputUrl  = div.querySelector('.edit-url');

        var updateBm = function() {
          var newUrl = inputUrl.value.trim();
          var newName = inputName.value.trim();
          if (newUrl) {
            if (!/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(newUrl)) newUrl = 'https://' + newUrl;
            bm.url = newUrl;
            div.href = newUrl;
          }
          bm.name = newName || extractTitleFromUrl(bm.url);
          inputName.value = bm.name;
          saveData();
        };

        inputName.addEventListener('change', updateBm);
        inputUrl.addEventListener('change', updateBm);
        inputName.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); });
        inputUrl.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); });

      } else {
        div.innerHTML =
          '<strong title="'+escHtml(bm.name)+'">'+escHtml(bm.name)+'</strong>'+
          '<small>'+tabTag+getDaysAgo(bm.lastOpened)+
          ' <span class="click-count">('+count+' opens)</span></small>'+
          '<button class="star-btn'+(isFav?' active':'')+'" data-id="'+bm.id+'" title="'+(isFav?'Marked important':'Mark as important')+'">'+(isFav?'★':'☆')+'</button>'+
          '<button class="delete-btn" data-id="'+bm.id+'">Delete</button>';

        var starBtn = div.querySelector('.star-btn');
        starBtn.addEventListener('click', function(e){
          e.preventDefault();
          e.stopPropagation();
          toggleFavorite(this.dataset.id);
        });
      }

      var btn = div.querySelector('.delete-btn');
      btn.addEventListener('click', function(e){
        e.preventDefault();
        e.stopPropagation();
        deleteBookmark(this.dataset.id);
      });

      div.addEventListener('click', function(e){
        if (e.target.classList.contains('delete-btn') || e.target.classList.contains('star-btn') || isEditMode) {
          e.preventDefault();
          return;
        }
        recordOpen(bm.id);
      });

      list1.appendChild(div);
    });
  }

  function deleteBookmark(id) {
    bookmarks = bookmarks.filter(function(b){ return b.id!==id; });
    saveData();
    displayBookmarks();
  }

  function toggleFavorite(id) {
    var bm = bookmarks.find(function(b){ return b.id===id; });
    if (!bm) return;
    bm.favorite = !bm.favorite;
    saveData();
    displayBookmarks();
  }

  function toggleDeleteButtons() {
    isEditMode = !isEditMode;
    document.body.classList.toggle('editMode', isEditMode);
    displayBookmarks();
    var hint = document.getElementById('hintText');
    if (hint) hint.textContent = isEditMode
      ? 'Edit Mode ON: Edit titles/URLs directly below or tap Delete'
      : 'Tap to open links';
    closeModal();
  }

  // ── Storage ──
  async function saveData() {
    var payload = { tabs: tabs, bookmarks: bookmarks, activeTab: activeTab };
    try {
      if (window.storage && window.storage.set) {
        await window.storage.set(STORAGE_KEY, JSON.stringify(payload), false);
      } else {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      }
    } catch(e) { console.error('Save failed:', e); }
  }

  async function loadData() {
    var raw = null;
    try {
      if (window.storage && window.storage.get) {
        var res = await window.storage.get(STORAGE_KEY, false);
        raw = res ? res.value : null;
      } else {
        raw = localStorage.getItem(STORAGE_KEY);
      }
    } catch(e) { raw = null; }

    if (raw) {
      try {
        var data = JSON.parse(raw);
        tabs = Array.isArray(data.tabs) && data.tabs.length ? data.tabs : defaultTabs();
        bookmarks = Array.isArray(data.bookmarks) ? data.bookmarks.map(function(bm,idx){
          var url = bm.url || '';
          return {
            id: bm.id || ('bm-'+idx+'-'+Date.now()),
            name: bm.name || extractTitleFromUrl(url),
            url: url,
            category: bm.category || (tabs[0] && tabs[0].id) || 'home',
            dateTime: bm.dateTime||'',
            lastOpened: (bm.lastOpened&&bm.lastOpened!=='Never'&&!isNaN(new Date(bm.lastOpened).getTime()))
                       ? new Date(bm.lastOpened).toISOString() : 'Never',
            clickCount: bm.clickCount||0,
            favorite: !!bm.favorite
          };
        }) : [];
        activeTab = (data.activeTab && tabs.some(function(t){return t.id===data.activeTab;}))
                    ? data.activeTab : tabs[0].id;
      } catch(e) {
        tabs = defaultTabs(); bookmarks = []; activeTab = 'home';
      }
    } else {
      tabs = defaultTabs(); bookmarks = []; activeTab = 'home';
    }
    renderTabs();
    displayBookmarks();
  }

  function exportBookmarks() {
    var blob=new Blob([JSON.stringify({tabs:tabs,bookmarks:bookmarks},null,2)],{type:'text/plain'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='bookmarks.txt';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }

  function importBookmarks() {
    var file=document.getElementById('importFile').files[0];
    if (!file) return;
    var reader=new FileReader();
    reader.onload=function(ev){
      try {
        var imported=JSON.parse(ev.target.result);
        var importedTabs = Array.isArray(imported.tabs) ? imported.tabs : null;
        var importedBms   = Array.isArray(imported.bookmarks) ? imported.bookmarks
                            : (Array.isArray(imported) ? imported : null);
        if (!importedBms) { alert('Invalid file format.'); return; }

        if (importedTabs) {
          importedTabs.forEach(function(t){
            if (t && t.id && !tabs.some(function(x){return x.id===t.id;})) tabs.push({id:t.id,name:t.name||t.id});
          });
        }

        var newBookmarks = importedBms.map(function(bm){
          var url = bm.url || '';
          return {
            id: 'bm-'+Date.now()+'-'+Math.floor(Math.random()*100000),
            name: bm.name || extractTitleFromUrl(url),
            url: url,
            category: (bm.category && tabs.some(function(t){return t.id===bm.category;})) ? bm.category : activeTab,
            dateTime: bm.dateTime||new Date().toISOString(),
            lastOpened: (bm.lastOpened&&!isNaN(new Date(bm.lastOpened).getTime()))
                       ? new Date(bm.lastOpened).toISOString() : 'Never',
            clickCount: bm.clickCount||0,
            favorite: !!bm.favorite
          };
        });

        bookmarks = bookmarks.concat(newBookmarks);
        saveData(); renderTabs(); displayBookmarks();
      } catch(err){ alert('Error: '+err.message); }
    };
    reader.readAsText(file);
    document.getElementById('importFile').value='';
  }

  document.getElementById('shortName').addEventListener('keypress',function(e){if(e.key==='Enter')addnsave();});
  document.getElementById('webURL').addEventListener('keypress',function(e){if(e.key==='Enter')addnsave();});

  // Live search: reorder matches to top and dim non-matches as the user types
  document.getElementById('searchBox').addEventListener('input', function(e){
    searchQuery = e.target.value.trim().toLowerCase();
    displayBookmarks();
  });

  // Keep the search field ready for typing after page initialization.
  document.addEventListener('DOMContentLoaded', function(){
    var searchBox = document.getElementById('searchBox');
    if (!searchBox) return;
    searchBox.focus();
    setTimeout(function(){ searchBox.focus(); }, 300);
  });

  loadData();
</script>
</body>
</html>
