<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bookmark Diary</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      padding: 10px;
      background: linear-gradient(135deg, #FFFFFF, #F7FFFD, #FFFFFF);
      background-size: 600% 600%;
      animation: gradientBG 10s ease infinite;
      color: #222;
      min-height: 100vh;
    }
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #00002F;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
    }
    .input-group { margin-bottom: 12px; }
    input[type="text"] {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      margin-bottom: 14px; font-size: 16px; background: #fff;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .button-group {
      display: flex; overflow-x: auto; gap: 10px;
      padding-bottom: 14px; margin-bottom: 20px;
    }
    .button-group button {
      flex: 0 0 auto; padding: 12px 18px; font-size: 16px;
      border: none; border-radius: 50px; color: #fff;
      transition: transform 0.2s;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
      cursor: pointer;
    }
    .button-group button:hover { transform: scale(1.05); }
    .button-group button:nth-child(1) { background: #ff3c38; }
    .button-group button:nth-child(2) { background: #ffa534; }
    .button-group button:nth-child(3) { background: #17c3b2; }
    .button-group button:nth-child(4) { background: #3d5af1; }
    .button-group button:nth-child(5) { background: #8338ec; }

    #bookdiv {
      display: flex;
      border: 1px solid #ddd;
      border-radius: 2px;
      background: rgba(255,255,255,0.8);
    }
    .bookmark-column { flex: 1; }

    .bookmark {
      text-align: center;
      background: #ffffffee;
      margin: 3px 3px;
      width: 95%;
      height: 60px;
      border-left: 4px solid #17c3b2;
      border-radius: 10px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.15);
      transition: transform 0.2s, opacity 0.2s, box-shadow 0.2s;
      position: relative;
      /* cursor is set dynamically via JS */
      user-select: none;
    }
    .bookmark:hover { transform: scale(1.015); }

    /* Item being dragged */
    .bookmark.dragging {
      opacity: 0.4;
      transform: scale(1.03);
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }
    /* Drop target highlight */
    .bookmark.drag-over {
      outline: 2px dashed #17c3b2;
    }

    .bookmark strong {
      font-size: 14px;
      display: block;
      padding-top: 8px;
      color: #111;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding-left: 6px;
      padding-right: 70px; /* space for delete btn */
    }
    .bookmark small {
      display: block;
      color: #888;
      font-size: 11px;
    }

    /* Click count badge */
    .click-count {
      display: inline-block;
    
      border-radius: 20px;
      font-size: 10px;
      padding: 1px 7px;
      margin-left: 4px;
      font-weight: 600;
      vertical-align: middle;
    }

    .bookmark .delete-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      right: 8px;
      background: #f51720;
      border: none;
      padding: 5px 9px;
      border-radius: 8px;
      color: #fff;
      font-size: 12px;
      display: none;
      cursor: pointer;
      z-index: 10;
    }
    .bookmark .delete-btn:hover { background: #d1131a; }

    @media (max-width: 500px) {
      #bookdiv { flex-direction: row; }
      .bookmark-column { max-width: 50%; margin: 10px 0; }
      .button-group button { padding: 10px 14px; font-size: 14px; }
    }

    #searchBox {
      padding: 10px 20px;
      width: 280px;
      border-radius: 50px;
      border: 1px solid #ccc;
      font-size: 18px;
    }
    #buttons {
      padding: 10px 20px;
      font-size: 18px;
      background: #FF3D00;
      color: white;
      border: none;
      border-radius: 50px;
      margin-left: 10px;
      width: 90px;
      cursor: pointer;
    }
    #buttons:hover { background: #45a049; }

    #dragHint {
      text-align: center;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 4px;
    }
  </style>
</head>

<body>
<h2>Bookmark Diary</h2>

<input type="text" id="searchBox" placeholder="google search...." onkeydown="if(event.key==='Enter') searchGoogle()">
<button id="buttons" onclick="searchGoogle()">Search</button>
<br><hr><hr><br>

<p id="dragHint">☰ Hold & drag bookmarks to reorder · Click to open</p>

<div id="bookdiv">
  <div class="bookmark-column" id="bookmarkList1"></div>
  <div class="bookmark-column" id="bookmarkList2"></div>
</div>

<br><hr><hr><br>

<div class="input-group">
 <input type="text" id="webURL" placeholder="Web URL (https://...)">
  <input type="text" id="shortName" placeholder="Short Name">
 
</div>

<div class="button-group">
  <button onclick="addnsave()">Add</button>
  <button onclick="toggleDeleteButtons()">Edit</button>
  <button onclick="document.getElementById('importFile').click()">Import</button>
  <button onclick="exportBookmarks()">Export</button>
  <button onclick="window.print()">Print</button>
</div>

<input type="file" id="importFile" accept=".txt" onchange="importBookmarks()" style="display:none;">

<script>
  let bookmarks = [];
  let isEditMode = false;

  // ── Drag state ──
  const DRAG_THRESHOLD = 6; // pixels of movement before drag activates
  let dragSrcIndex = null;
  let dragPointerStart = null;   // { x, y }
  let dragActivated = false;
  let dragTargetEl = null;

  // ── Date helper ──
  function getDaysAgo(dateStr) {
    if (!dateStr || dateStr === "Never") return "Never opened";
    const lastOpened = new Date(dateStr);
    if (isNaN(lastOpened.getTime())) return "Never opened";
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const bookmarkDate = new Date(lastOpened.getFullYear(), lastOpened.getMonth(), lastOpened.getDate());
    const diffDays = Math.floor((today - bookmarkDate) / 86400000);
    if (diffDays <= 0) return "Opened today";
    if (diffDays === 1) return "1 day ago";
    return `${diffDays} days ago`;
  }

  // ── Search ──
  function searchGoogle() {
    const query = document.getElementById('searchBox').value;
    if (query.trim()) {
      window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(query);
    } else {
      alert("Please enter a search term.");
    }
  }

  // ── Add ──
  function addBookmark() {
    const name = document.getElementById('shortName').value.trim();
    const url  = document.getElementById('webURL').value.trim();
    if (!name || !url) { alert('Please fill both fields.'); return; }
    bookmarks.push({
      name,
      url,
      dateTime: new Date().toISOString(),
      lastOpened: "Never",
      clickCount: 0          // ← NEW: track clicks
    });
    displayBookmarks();
    document.getElementById('shortName').value = '';
    document.getElementById('webURL').value = '';
  }

  // ── Display ──
  function displayBookmarks() {
    const list1 = document.getElementById('bookmarkList1');
    const list2 = document.getElementById('bookmarkList2');
    list1.innerHTML = '';
    list2.innerHTML = '';

    bookmarks.forEach((bm, index) => {
      const div = document.createElement('div');
      div.className = 'bookmark';
      div.dataset.index = index;
      div.style.cursor = 'pointer';

      const count = bm.clickCount || 0;
      div.innerHTML = `
        <strong title="${bm.name}">
          ${bm.name}

        </strong>
        <small>          ${getDaysAgo(bm.lastOpened)}
		<span class="click-count" title="Times opened"> (${count}&nbsptimes)</span></small>
        <button class="delete-btn" data-index="${index}">Delete</button>
      `;

      // Show delete button if in edit mode
      if (isEditMode) {
        div.querySelector('.delete-btn').style.display = 'block';
      }

      // Delete button — stop all propagation
      div.querySelector('.delete-btn').addEventListener('pointerdown', e => e.stopPropagation());
      div.querySelector('.delete-btn').addEventListener('click', e => {
        e.stopPropagation();
        deleteBookmark(parseInt(e.currentTarget.dataset.index));
      });

      // ── Pointer-based drag with threshold ──
      div.addEventListener('pointerdown', onPointerDown);

      if (index % 2 === 0) list1.appendChild(div);
      else                  list2.appendChild(div);
    });
  }

  // ── Pointer handlers (threshold-based drag) ──
  function onPointerDown(e) {
    // Ignore if clicking delete button
    if (e.target.classList.contains('delete-btn')) return;

    dragSrcIndex = parseInt(this.dataset.index);
    dragPointerStart = { x: e.clientX, y: e.clientY };
    dragActivated = false;
    dragTargetEl = null;

    this.setPointerCapture(e.pointerId);
    this.addEventListener('pointermove', onPointerMove);
    this.addEventListener('pointerup',   onPointerUp);
    this.addEventListener('pointercancel', onPointerCancel);
  }

  function onPointerMove(e) {
    if (!dragPointerStart) return;

    const dx = e.clientX - dragPointerStart.x;
    const dy = e.clientY - dragPointerStart.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (!dragActivated && dist > DRAG_THRESHOLD) {
      // Enough movement — activate drag mode
      dragActivated = true;
      this.classList.add('dragging');
      this.style.cursor = 'grabbing';
    }

    if (dragActivated) {
      // Find element under pointer (excluding the dragged item)
      const elUnder = getBookmarkUnder(e.clientX, e.clientY, this);
      if (dragTargetEl && dragTargetEl !== elUnder) {
        dragTargetEl.classList.remove('drag-over');
      }
      if (elUnder) {
        elUnder.classList.add('drag-over');
        dragTargetEl = elUnder;
      } else {
        dragTargetEl = null;
      }
    }
  }

  function onPointerUp(e) {
    cleanup(this, e.pointerId);

    if (dragActivated && dragTargetEl) {
      // Perform swap
      const targetIndex = parseInt(dragTargetEl.dataset.index);
      if (dragSrcIndex !== null && dragSrcIndex !== targetIndex) {
        const temp = bookmarks[dragSrcIndex];
        bookmarks[dragSrcIndex] = bookmarks[targetIndex];
        bookmarks[targetIndex]  = temp;
        saveBookmarks();
        displayBookmarks();
        if (isEditMode) {
          document.querySelectorAll('.delete-btn').forEach(b => b.style.display = 'block');
        }
      }
    } else if (!dragActivated) {
      // It was a genuine click — open the bookmark
      openBookmark(dragSrcIndex);
    }

    dragSrcIndex = null;
    dragPointerStart = null;
    dragActivated = false;
    dragTargetEl = null;
  }

  function onPointerCancel(e) {
    cleanup(this, e.pointerId);
    dragSrcIndex = null;
    dragPointerStart = null;
    dragActivated = false;
    if (dragTargetEl) dragTargetEl.classList.remove('drag-over');
    dragTargetEl = null;
  }

  function cleanup(el, pointerId) {
    try { el.releasePointerCapture(pointerId); } catch(_) {}
    el.classList.remove('dragging');
    el.style.cursor = 'pointer';
    if (dragTargetEl) dragTargetEl.classList.remove('drag-over');
    el.removeEventListener('pointermove', onPointerMove);
    el.removeEventListener('pointerup',   onPointerUp);
    el.removeEventListener('pointercancel', onPointerCancel);
  }

  // Returns the bookmark div element under (cx, cy), skipping `exclude`
  function getBookmarkUnder(cx, cy, exclude) {
    const all = document.querySelectorAll('.bookmark');
    for (const el of all) {
      if (el === exclude) continue;
      const rect = el.getBoundingClientRect();
      if (cx >= rect.left && cx <= rect.right && cy >= rect.top && cy <= rect.bottom) {
        return el;
      }
    }
    return null;
  }

  // ── CRUD & storage ──
  function addnsave()      { addBookmark(); saveBookmarks(); }
  function saveBookmarks() { localStorage.setItem('myBookmarks', JSON.stringify(bookmarks)); }

  function openBookmark(index) {
    if (index === null || index === undefined) return;
    bookmarks[index].lastOpened = new Date().toISOString();
    bookmarks[index].clickCount = (bookmarks[index].clickCount || 0) + 1;  // ← increment
    saveBookmarks();
    displayBookmarks();
    // Restore edit mode UI after redraw
    if (isEditMode) {
      document.querySelectorAll('.delete-btn').forEach(b => b.style.display = 'block');
    }
    window.open(bookmarks[index].url, '_blank');
  }

  function deleteBookmark(index) {
    bookmarks.splice(index, 1);
    saveBookmarks();
    isEditMode = false;
    displayBookmarks();
  }

  function toggleDeleteButtons() {
    isEditMode = !isEditMode;
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.style.display = isEditMode ? 'block' : 'none';
    });
  }

  function exportBookmarks() {
    const blob = new Blob([JSON.stringify(bookmarks, null, 2)], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'bookmarks.txt';
    a.click();
  }

  function importBookmarks() {
    const file = document.getElementById('importFile').files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const imported = JSON.parse(e.target.result);
        if (Array.isArray(imported)) {
          const normalized = imported.map(bm => ({
            name:       bm.name       || '',
            url:        bm.url        || '',
            dateTime:   bm.dateTime   || new Date().toISOString(),
            lastOpened: (bm.lastOpened && !isNaN(new Date(bm.lastOpened).getTime()))
                        ? new Date(bm.lastOpened).toISOString() : "Never",
            clickCount: bm.clickCount || 0   // ← preserve click count on import
          }));
          bookmarks = bookmarks.concat(normalized);
          saveBookmarks();
          displayBookmarks();
        } else { alert('Invalid file format.'); }
      } catch { alert('Error reading file.'); }
    };
    reader.readAsText(file);
  }

  function loadBookmarks() {
    const stored = localStorage.getItem('myBookmarks');
    if (stored) {
      try {
        bookmarks = JSON.parse(stored).map(bm => ({
          name:       bm.name       || '',
          url:        bm.url        || '',
          dateTime:   bm.dateTime   || '',
          lastOpened: (bm.lastOpened && bm.lastOpened !== "Never" && !isNaN(new Date(bm.lastOpened).getTime()))
                      ? new Date(bm.lastOpened).toISOString() : "Never",
          clickCount: bm.clickCount || 0    // ← load click count, default 0
        }));
      } catch { bookmarks = []; }
      displayBookmarks();
    }
  }

  document.getElementById('webURL').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') addnsave();
  });

  loadBookmarks();
</script>
</body>
</html>
