<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bookmark Diary</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif; padding: 10px;
      background: linear-gradient(135deg, #FFFFFF, #F7FFFD, #FFFFFF);
      background-size: 600% 600%; animation: gradientBG 10s ease infinite;
      color: #222; min-height: 100vh;
    }
    @keyframes gradientBG {
      0%{ background-position:0% 50%; } 50%{ background-position:100% 50%; } 100%{ background-position:0% 50%; }
    }
    h2 { text-align:center; margin-bottom:20px; color:#00002F; text-shadow:1px 1px 3px rgba(0,0,0,0.4); }
    .input-group { margin-bottom:12px; }
    input[type="text"] {
      width:100%; padding:14px; border:none; border-radius:12px;
      margin-bottom:14px; font-size:16px; background:#fff;
      box-shadow:0 4px 8px rgba(0,0,0,0.1);
    }
    .button-group { display:flex; overflow-x:auto; gap:10px; padding-bottom:14px; margin-bottom:20px; }
    .button-group button {
      flex:0 0 auto; padding:12px 18px; font-size:16px; border:none;
      border-radius:50px; color:#fff; transition:transform 0.2s;
      box-shadow:0 3px 6px rgba(0,0,0,0.2); cursor:pointer;
    }
    .button-group button:hover { transform:scale(1.05); }
    .button-group button:nth-child(1){ background:#ff3c38; }
    .button-group button:nth-child(2){ background:#ffa534; }
    .button-group button:nth-child(3){ background:#17c3b2; }
    .button-group button:nth-child(4){ background:#3d5af1; }
    .button-group button:nth-child(5){ background:#8338ec; }

    #bookdiv { display:flex; min-height:200px; border:1px solid #ddd; border-radius:2px; background:rgba(255,255,255,0.8); }
    .bookmark-column { flex:1; padding:4px 0; }

    .bookmark {
      display:block; text-align:left; background:#ffffffee;
      margin:4px auto; width:95%; min-height:60px;
      border-left:4px solid #17c3b2; border-radius:10px;
      box-shadow:0 3px 6px rgba(0,0,0,0.15);
      transition:transform 0.15s, opacity 0.15s;
      position:relative; cursor:pointer;
      user-select:none; -webkit-user-select:none; touch-action:pan-y;
    }
    .bookmark:hover { transform:scale(1.015); }
    .bookmark.dragging { opacity:0.4; transform:scale(1.03); box-shadow:0 8px 20px rgba(0,0,0,0.25); }
    .bookmark.drag-over { outline:2px dashed #17c3b2; }

    .bookmark strong {
      font-size:14px; display:block; padding:10px 72px 2px 10px;
      color:#111; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .bookmark small { display:block; padding:0 10px 8px 10px; color:#888; font-size:11px; }
    .click-count { color:#17c3b2; font-size:11px; font-weight:600; }

    .bookmark .delete-btn {
      position:absolute; top:50%; transform:translateY(-50%); right:8px;
      background:#f51720; border:none; padding:5px 9px; border-radius:8px;
      color:#fff; font-size:12px; display:none; cursor:pointer; z-index:10; touch-action:auto;
    }
    .bookmark .delete-btn:hover { background:#d1131a; }

    @media (max-width:500px) {
      #bookdiv { flex-direction:column; }
      .bookmark-column { width:100%; }
      .button-group button { padding:10px 14px; font-size:14px; }
      #searchBox { width:60%; }
    }
    #searchBox { padding:10px 20px; width:280px; border-radius:50px; border:1px solid #ccc; font-size:18px; }
    #buttons {
      padding:10px 20px; font-size:18px; background:#FF3D00; color:white;
      border:none; border-radius:50px; margin-left:10px; width:90px; cursor:pointer;
    }
    #buttons:hover { background:#45a049; }
    #dragHint { text-align:center; font-size:12px; color:#aaa; margin-bottom:4px; }
  </style>
</head>
<body>

<h2>Bookmark Diary</h2>
<input type="text" id="searchBox" placeholder="google search...."
  onkeydown="if(event.key==='Enter') searchGoogle()">
<button id="buttons" onclick="searchGoogle()">Search</button>
<br><hr><hr><br>

<p id="dragHint">☰ <span id="hintText">Tap to open links</span></p>
<div id="bookdiv">
  <div class="bookmark-column" id="bookmarkList1"></div>
  <div class="bookmark-column" id="bookmarkList2"></div>
</div>
<br><hr><hr><br>

<div class="input-group">
  <input type="text" id="webURL"    placeholder="Web URL (https://...)">
  <input type="text" id="shortName" placeholder="Short Name">
</div>
<div class="button-group">
  <button onclick="addnsave()">Add</button>
  <button onclick="toggleDeleteButtons()">Edit</button>
  <button onclick="document.getElementById('importFile').click()">Import</button>
  <button onclick="exportBookmarks()">Export</button>
  <button onclick="window.print()">Print</button>
</div>
<input type="file" id="importFile" accept=".txt" onchange="importBookmarks()" style="display:none;">

<script>
  var bookmarks  = [];
  var isEditMode = false;

  // Pointer / drag state
  var TAP_MOVE_MAX   = 10;   // px — more than this = not a tap
  var DRAG_THRESHOLD = 12;   // px — movement needed to start drag (edit mode)
  var DRAG_ANGLE_MAX = 45;   // degrees — mostly-horizontal = drag
  var LONG_PRESS_MS  = 400;

  var longPressTimer   = null;
  var dragSrcIndex     = null;
  var dragSrcEl        = null;
  var dragPointerStart = null;
  var dragActivated    = false;
  var dragTargetEl     = null;
  var tapCancelled     = false;  // ← NEW: set true if pointer moved too much

  // ── helpers ──────────────────────────────────────────────────────────────
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function getDaysAgo(dateStr) {
    if (!dateStr || dateStr==='Never') return 'Never opened';
    var d = new Date(dateStr);
    if (isNaN(d.getTime())) return 'Never opened';
    var today=new Date(); today.setHours(0,0,0,0);
    var bDay=new Date(d); bDay.setHours(0,0,0,0);
    var diff=Math.floor((today-bDay)/86400000);
    if (diff<=0) return 'Opened today';
    if (diff===1) return '1 day ago';
    return diff+' days ago';
  }

  function openBookmark(idx) {
    var url = bookmarks[idx].url;
    var a = document.createElement('a');
    a.href=url; a.target='_blank'; a.rel='noopener noreferrer';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    bookmarks[idx].lastOpened = new Date().toISOString();
    bookmarks[idx].clickCount = (bookmarks[idx].clickCount||0) + 1;
    saveBookmarks();
    displayBookmarks();
  }

  function searchGoogle() {
    var q=document.getElementById('searchBox').value.trim();
    if (q) window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank');
    else   alert('Please enter a search term.');
  }

  // ── bookmark CRUD ─────────────────────────────────────────────────────────
  function addBookmark() {
    var name=document.getElementById('shortName').value.trim();
    var url =document.getElementById('webURL').value.trim();
    if (!name||!url){ alert('Please fill both fields.'); return false; }
    if (!/^https?:\/\//i.test(url)) url='https://'+url;
    bookmarks.push({name:name,url:url,dateTime:new Date().toISOString(),lastOpened:'Never',clickCount:0});
    document.getElementById('shortName').value='';
    document.getElementById('webURL').value='';
    displayBookmarks();
    return true;
  }
  function addnsave(){ if(addBookmark()) saveBookmarks(); }

  function displayBookmarks() {
    var list1=document.getElementById('bookmarkList1');
    var list2=document.getElementById('bookmarkList2');
    list1.innerHTML=''; list2.innerHTML='';
    bookmarks.forEach(function(bm,index){
      var div=document.createElement('div');
      div.className='bookmark';
      div.dataset.index=index;
      div.style.cursor = isEditMode ? 'grab' : 'pointer';
      var count=bm.clickCount||0;
      div.innerHTML=
        '<strong title="'+escHtml(bm.name)+'">'+escHtml(bm.name)+'</strong>'+
        '<small>'+getDaysAgo(bm.lastOpened)+
        ' <span class="click-count">('+count+' times)</span></small>'+
        '<button class="delete-btn" data-index="'+index+'">Delete</button>';
      if (isEditMode) div.querySelector('.delete-btn').style.display='block';

      var btn=div.querySelector('.delete-btn');
      btn.addEventListener('pointerdown',function(e){ e.stopPropagation(); });
      btn.addEventListener('click',function(e){
        e.stopPropagation();
        deleteBookmark(parseInt(this.dataset.index));
      });

      div.addEventListener('pointerdown', onPointerDown);
      (index%2===0?list1:list2).appendChild(div);
    });
  }

  // ── POINTER DOWN ──────────────────────────────────────────────────────────
  function onPointerDown(e) {
    if (e.target.classList.contains('delete-btn')) return;
    if (e.pointerType==='mouse' && e.button!==0) return;

    dragSrcIndex     = parseInt(this.dataset.index);
    dragSrcEl        = this;
    dragPointerStart = { x:e.clientX, y:e.clientY };
    dragActivated    = false;
    dragTargetEl     = null;
    tapCancelled     = false;   // ← reset tap guard

    if (isEditMode) {
      // Long-press to start drag
      longPressTimer = setTimeout(function() {
        if (!dragActivated) {
          dragActivated = true;
          dragSrcEl.classList.add('dragging');
          dragSrcEl.style.cursor = 'grabbing';
          document.body.style.userSelect = 'none';
          if (navigator.vibrate) navigator.vibrate(40);
        }
      }, LONG_PRESS_MS);
    }

    document.addEventListener('pointermove',   onDocMove);
    document.addEventListener('pointerup',     onDocUp);
    document.addEventListener('pointercancel', onDocCancel);
  }

  // ── POINTER MOVE ──────────────────────────────────────────────────────────
  function onDocMove(e) {
    if (dragSrcIndex === null) return;
    var dx   = e.clientX - dragPointerStart.x;
    var dy   = e.clientY - dragPointerStart.y;
    var dist = Math.hypot(dx, dy);

    // Cancel tap if finger/mouse moved too much (normal OR edit mode)
    if (dist > TAP_MOVE_MAX) tapCancelled = true;

    if (isEditMode) {
      if (!dragActivated && dist > DRAG_THRESHOLD) {
        var angle = Math.abs(Math.atan2(Math.abs(dy), Math.abs(dx)) * 180 / Math.PI);
        if (angle > DRAG_ANGLE_MAX) {
          // Vertical scroll — abort drag tracking entirely
          clearTimeout(longPressTimer); longPressTimer = null;
          removeDocListeners();
          resetDragState();
          return;
        }
        clearTimeout(longPressTimer); longPressTimer = null;
        dragActivated = true;
        dragSrcEl.classList.add('dragging');
        dragSrcEl.style.cursor = 'grabbing';
        document.body.style.userSelect = 'none';
      }

      if (dragActivated) {
        var under = bookmarkUnder(e.clientX, e.clientY, dragSrcEl);
        if (dragTargetEl && dragTargetEl !== under) dragTargetEl.classList.remove('drag-over');
        dragTargetEl = under;
        if (dragTargetEl) dragTargetEl.classList.add('drag-over');
      }
    }
  }

  // ── POINTER UP ────────────────────────────────────────────────────────────
  function onDocUp(e) {
    clearTimeout(longPressTimer); longPressTimer = null;
    removeDocListeners();
    document.body.style.userSelect = '';

    var srcIndex   = dragSrcIndex;
    var wasDrag    = dragActivated;
    var dropTarget = dragTargetEl;
    var wasTap     = !tapCancelled;  // ← clean tap only if pointer barely moved

    if (dragSrcEl)   { dragSrcEl.classList.remove('dragging'); dragSrcEl.style.cursor = isEditMode ? 'grab' : 'pointer'; }
    if (dragTargetEl)  dragTargetEl.classList.remove('drag-over');

    resetDragState();

    if (!isEditMode) {
      // Normal mode: open link only on a clean tap
      if (wasTap) openBookmark(srcIndex);
      return;
    }

    // Edit mode: reorder on drop
    if (wasDrag && dropTarget) {
      var ti = parseInt(dropTarget.dataset.index);
      if (srcIndex !== null && srcIndex !== ti) {
        var temp = bookmarks[srcIndex];
        bookmarks[srcIndex] = bookmarks[ti];
        bookmarks[ti] = temp;
        saveBookmarks();
        displayBookmarks();
        // Re-show delete buttons after re-render
        document.querySelectorAll('.delete-btn').forEach(function(b){ b.style.display='block'; });
      }
    }
  }

  // ── CANCEL / CLEANUP ──────────────────────────────────────────────────────
  function onDocCancel() {
    clearTimeout(longPressTimer); longPressTimer = null;
    removeDocListeners();
    document.body.style.userSelect = '';
    if (dragSrcEl)   { dragSrcEl.classList.remove('dragging'); dragSrcEl.style.cursor = isEditMode ? 'grab' : 'pointer'; }
    if (dragTargetEl)  dragTargetEl.classList.remove('drag-over');
    resetDragState();
  }

  function removeDocListeners() {
    document.removeEventListener('pointermove',   onDocMove);
    document.removeEventListener('pointerup',     onDocUp);
    document.removeEventListener('pointercancel', onDocCancel);
  }

  function resetDragState() {
    dragSrcIndex     = null;
    dragSrcEl        = null;
    dragPointerStart = null;
    dragActivated    = false;
    dragTargetEl     = null;
    tapCancelled     = false;
  }

  function bookmarkUnder(cx, cy, skip) {
    var all = document.querySelectorAll('.bookmark');
    for (var i=0; i<all.length; i++) {
      if (all[i]===skip) continue;
      var r = all[i].getBoundingClientRect();
      if (cx>=r.left && cx<=r.right && cy>=r.top && cy<=r.bottom) return all[i];
    }
    return null;
  }

  // ── STORAGE ───────────────────────────────────────────────────────────────
  function saveBookmarks() {
    try { localStorage.setItem('myBookmarks', JSON.stringify(bookmarks)); }
    catch(e){ alert('Storage error: '+e.message); }
  }

  function deleteBookmark(index) {
    bookmarks.splice(index,1); saveBookmarks(); isEditMode=false; displayBookmarks();
  }

  function toggleDeleteButtons() {
    isEditMode = !isEditMode;
    document.querySelectorAll('.delete-btn').forEach(function(btn){
      btn.style.display = isEditMode ? 'block' : 'none';
    });
    document.querySelectorAll('.bookmark').forEach(function(bm){
      bm.style.cursor = isEditMode ? 'grab' : 'pointer';
    });
    var hint = document.getElementById('hintText');
    if (hint) hint.textContent = isEditMode
      ? 'Edit ON: drag to reorder · tap Delete to remove'
      : 'Tap to open links';
  }

  function exportBookmarks() {
    var blob=new Blob([JSON.stringify(bookmarks,null,2)],{type:'text/plain'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='bookmarks.txt';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }

  function importBookmarks() {
    var file=document.getElementById('importFile').files[0];
    if (!file) return;
    var reader=new FileReader();
    reader.onload=function(ev){
      try {
        var imported=JSON.parse(ev.target.result);
        if (Array.isArray(imported)) {
          bookmarks=bookmarks.concat(imported.map(function(bm){
            return {
              name:      bm.name||'',
              url:       bm.url||'',
              dateTime:  bm.dateTime||new Date().toISOString(),
              lastOpened:(bm.lastOpened&&!isNaN(new Date(bm.lastOpened).getTime()))
                         ?new Date(bm.lastOpened).toISOString():'Never',
              clickCount:bm.clickCount||0
            };
          }));
          saveBookmarks(); displayBookmarks();
        } else alert('Invalid file format.');
      } catch(err){ alert('Error: '+err.message); }
    };
    reader.readAsText(file);
    document.getElementById('importFile').value='';
  }

  function loadBookmarks() {
    try {
      var stored=localStorage.getItem('myBookmarks');
      if (!stored) return;
      bookmarks=JSON.parse(stored).map(function(bm){
        return {
          name:      bm.name||'',
          url:       bm.url||'',
          dateTime:  bm.dateTime||'',
          lastOpened:(bm.lastOpened&&bm.lastOpened!=='Never'&&
                      !isNaN(new Date(bm.lastOpened).getTime()))
                     ?new Date(bm.lastOpened).toISOString():'Never',
          clickCount:bm.clickCount||0
        };
      });
    } catch(e){ bookmarks=[]; }
    displayBookmarks();
  }

  document.getElementById('shortName').addEventListener('keypress',function(e){if(e.key==='Enter')addnsave();});
  document.getElementById('webURL').addEventListener('keypress',function(e){if(e.key==='Enter')addnsave();});

  loadBookmarks();
</script>
</body>
</html>
